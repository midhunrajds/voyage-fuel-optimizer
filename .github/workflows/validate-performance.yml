name: Validate voyage performance

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  performance-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.2 numpy==1.26.4 scikit-learn==1.4.2

      - name: Run grouped performance analysis
        run: python scripts/performance_analysis.py

      - name: Run vessel holdout validation
        run: python scripts/validate_generalisation.py

      - name: Upload analysis output
        uses: actions/upload-artifact@v4
        with:
          name: voyage-performance-analysis
          path: outputs/voyage_performance_oof.csv
